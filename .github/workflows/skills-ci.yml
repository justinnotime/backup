name: Skill CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  skill:
    name: ${{ matrix.skill }} / ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - skill: github-archive
            kind: python
            python: "3.10"
            check: Python 3.10
          - skill: github-archive
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: agent-session-extraction
            kind: python
            python: "3.11"
            check: Python 3.11
          - skill: agent-session-extraction
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: state-backup
            kind: shell
            check: backup tests
          - skill: agent-harness-profiles
            kind: shell
            check: installation tests
          - skill: remote-clipboard
            kind: syntax
            check: shell syntax only
          - skill: syncthing-doctor
            kind: syntax
            check: shell syntax only
    env:
      SKILL: ${{ matrix.skill }}
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy only this Skill
        run: |
          mkdir -p "$RUNNER_TEMP/skill-check"
          cp -a "$GITHUB_WORKSPACE/skills/$SKILL" "$RUNNER_TEMP/skill-check/$SKILL"
      - name: Set up uv and Python
        if: matrix.kind == 'python'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.30"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Install test command dependencies
        if: matrix.kind != 'syntax' && matrix.skill != 'github-archive'
        run: |
          case "$SKILL" in
            agent-session-extraction) packages=(git-crypt) ;;
            state-backup|agent-harness-profiles) packages=(rsync sqlite3) ;;
          esac
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
      - name: Run Python package tests
        if: matrix.kind == 'python'
        working-directory: ${{ runner.temp }}/skill-check/${{ matrix.skill }}
        run: |
          uv sync --locked --all-extras
          uv run --no-sync pytest tests -q -rs
      - name: Run shell package tests
        if: matrix.kind == 'shell'
        working-directory: ${{ runner.temp }}/skill-check/${{ matrix.skill }}
        run: |
          bash tests/run.sh
          if [[ "$SKILL" == state-backup ]]; then
            python3 -B -m unittest discover -s tests -v
          fi
      - name: Check shell syntax
        if: matrix.kind == 'syntax'
        working-directory: ${{ runner.temp }}/skill-check/${{ matrix.skill }}
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -print0)

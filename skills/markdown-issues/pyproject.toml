[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markdown-issues"
version = "0.1.0"
description = "Configured local Markdown issue tracking and Git history validation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
markdown-issues = "markdown_issues.tracker:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "skills-ref>=0.1.0; python_version >= '3.11'"]

[tool.hatch.build.targets.wheel]
packages = ["src/markdown_issues"]

[tool.ruff]
target-version = "py310"
line-length = 100

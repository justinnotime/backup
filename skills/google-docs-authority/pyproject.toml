[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "google-docs-authority-skill"
version = "0.1.0"
description = "Caller-configured Google document publication and authority tracking"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.16,<1"]

[project.scripts]
gdocs-publish = "google_docs_authority.publisher:main"
gdocs-registry = "google_docs_authority.registry:main"
gdocs-fingerprint = "google_docs_authority.fingerprint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

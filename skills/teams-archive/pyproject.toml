[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teams-archive-skill"
version = "0.1.0"
description = "Configurable Microsoft Teams chat and attachment archiving"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "html2text>=2024.2.26", "msal>=1.30,<2", "requests>=2.32,<3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
teams-archive = "teams_archive:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["teams_archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]

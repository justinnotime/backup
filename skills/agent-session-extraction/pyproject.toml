[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-session-extraction"
version = "0.1.0"
description = "Deterministic, manifest-driven extraction of agent harness sessions"
requires-python = ">=3.11"

[project.scripts]
agent-session-extraction = "agent_skills.sessions.cli:main"

[project.optional-dependencies]
test = ["jsonschema>=4", "pytest>=8", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

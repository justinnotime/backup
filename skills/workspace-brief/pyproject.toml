[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workspace-brief"
version = "0.1.0"
description = "Configured local workspace startup briefings"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
workspace-brief = "workspace_brief.brief:main"
workspace-brief-install-hook = "workspace_brief.install:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "skills-ref>=0.1.1; python_version >= '3.11'"]

[tool.hatch.build.targets.wheel]
packages = ["src/workspace_brief"]

[tool.ruff]
target-version = "py310"
line-length = 100

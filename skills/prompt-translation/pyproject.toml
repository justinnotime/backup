[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-translation"
version = "0.1.0"
description = "Configured incremental prompt translation with reusable daily provenance ledgers"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40,<1", "httpx>=0.27,<1"]

[project.scripts]
prompt-translate = "prompt_translation.translate:main"
prompt-validate = "prompt_translation.validation:main"
prompt-translation-run = "prompt_translation.scheduled:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "skills-ref>=0.1.0; python_version >= '3.11'"]

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_translation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

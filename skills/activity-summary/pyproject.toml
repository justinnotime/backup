[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "activity-summary"
version = "0.1.0"
description = "Deterministic activity facts and configured daily and weekly summaries"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "skills-ref>=0.1.0; python_version >= '3.11'"]

[tool.hatch.build.targets.wheel]
packages = ["src/activity_summary"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-archive-skill"
version = "0.1.0"
description = "Configurable read-only GitHub issue and pull-request archiving"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
github-archive = "github_archive:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["github_archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]

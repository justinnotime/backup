[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-archive-skill"
version = "0.1.0"
description = "GitHub issue archiving and local dependency graphs, timelines and inventories"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "skills-ref>=0.1.1; python_version >= '3.11'"]

[project.scripts]
github-archive = "github_archive:main"
github-issue-graph = "issue_graph:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["github_archive", "issue_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

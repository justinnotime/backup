[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-archive-skill"
version = "0.1.0"
description = "Independently configured Slack conversation and thread archiving"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
slack-archive = "slack_archive:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["slack_archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]

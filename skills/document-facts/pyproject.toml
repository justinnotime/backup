[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-facts-skill"
version = "0.1.0"
description = "Configurable document fact extraction, digests, timelines and thematic threads"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "anthropic>=0.49,<1", "json-repair>=0.30,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.16,<1", "skills-ref==0.1.1; python_version >= '3.11'"]

[project.scripts]
document-facts = "document_facts.runtime:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

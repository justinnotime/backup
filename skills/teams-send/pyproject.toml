[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teams-send-skill"
version = "0.1.0"
description = "Preview and send authorized Teams chat messages with private configuration"
requires-python = ">=3.10"
dependencies = ["msal>=1.30,<2", "requests>=2.32,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.16,<1"]

[project.scripts]
teams-send = "teams_send:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["teams_send"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

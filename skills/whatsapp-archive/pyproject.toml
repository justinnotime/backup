[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-archive-skill"
version = "0.1.0"
description = "Receive-only WhatsApp spool and configurable Markdown archiving"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.16,<1"]

[project.scripts]
whatsapp-archive = "whatsapp_archive:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["whatsapp_archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]

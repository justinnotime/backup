[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-mentions-skill"
version = "0.1.0"
description = "Private Teams attention collection and local reply drafts"
requires-python = ">=3.10"
dependencies = ["msal>=1.30,<2", "requests>=2.32,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.16,<1"]

[project.scripts]
chat-mentions = "chat_mentions.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
